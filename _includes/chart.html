<figure class="chart-container"
        {% if include.caption %}
        aria-label="{{ include.id }}: {{ include.caption | strip_html | truncate: 200 }}"
        {% else %}
        aria-label="BTC chart {{ include.id }}"
        {% endif %}>
  {% assign chart_ratio = '' %}
  {% if include.ratio %}{% assign chart_ratio = include.ratio %}{% endif %}
  {% assign chart_height = '500px' %}
  {% if include.height %}{% assign chart_height = include.height %}{% endif %}
  <div class="chart-swipe" style="--chart-h:{{ chart_height }}"{% if chart_ratio %} data-ratio="{{ chart_ratio }}"{% endif %}>
    <iframe src="{{ '/assets/charts/' | append: include.id | append: '.html' | relative_url }}"
            title="{{ include.caption | default: include.id }}"
            loading="lazy"></iframe>
  </div>
  {% if include.caption %}
  <figcaption class="chart-caption">{{ include.caption }}</figcaption>
  {% endif %}
</figure>
